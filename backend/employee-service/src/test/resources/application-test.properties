# In-memory database for automated tests
spring.datasource.url=jdbc:h2:mem:nexus_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema only for isolated tests
spring.jpa.hibernate.ddl-auto=create-drop

# Disable PostgreSQL-specific Flyway migrations for this test profile
spring.flyway.enabled=false

# Avoid unnecessary SQL output
spring.jpa.show-sql=false

spring.jpa.open-in-view=false